async_mode: threaded
cache:
  base_dir: cache
  type: file
chunks:
  overlap: 100
  size: 1200
claim_extraction:
  description: Any claims or facts that could be relevant to medical information discovery,
    treatment outcomes, or research findings.
  enabled: true
  max_gleanings: 1
  prompt: prompts/claim_extraction.txt
cluster_graph:
  max_cluster_size: 10
community_report:
  max_input_length: 8000
  max_length: 2000
  prompt: prompts/community_report.txt
embed_graph:
  enabled: false
embeddings:
  api_base: http://host.docker.internal:12434/engines/llama.cpp/v1
  api_key: not_required
  api_type: openai_embedding
  concurrent_requests: 1
  model: nomic-embed-text
  request_timeout: 180.0
encoding_model: cl100k_base
entity_extraction:
  entity_types:
  - person
  - organization
  - location
  - event
  - concept
  - technology
  - medical_condition
  - treatment
  - medication
  - procedure
global_search:
  concurrency: 1
  data_max_tokens: 12000
  map_max_tokens: 1000
  max_tokens: 12000
  reduce_max_tokens: 2000
input:
  base_dir: input
  file_encoding: utf-8
  file_pattern: .*\.txt$
  file_type: text
  type: file
llm:
  api_base: http://host.docker.internal:12434/engines/llama.cpp/v1
  api_key: not_required
  api_type: openai_chat
  concurrent_requests: 1
  max_tokens: 4000
  model: ai/gpt-oss:latest
  request_timeout: 180.0
  temperature: 0.1
local_search:
  community_prop: 0.1
  conversation_history_max_turns: 5
  max_tokens: 12000
  text_unit_prop: 0.5
  top_k_mapped_entities: 10
  top_k_relationships: 10
models:
  default_chat_model:
    api_key: not_required
    async_mode: threaded
    auth_type: none
    concurrent_requests: 1
    max_retries: 3
    model: ai/gpt-oss:latest
    model_provider: openai
    retry_strategy: exponential_backoff
    type: chat
  default_embedding_model:
    api_key: not_required
    async_mode: threaded
    auth_type: none
    concurrent_requests: 1
    max_retries: 3
    model: nomic-embed-text
    model_provider: openai
    retry_strategy: exponential_backoff
    type: embedding
parallelization:
  stagger: 0.3
reporting:
  base_dir: output/timestamp/reports
  type: file
skip_workflows: []
snapshots:
  graphml: true
  raw_entities: true
  top_level_nodes: true
storage:
  base_dir: output/timestamp/artifacts
  type: file
summarize_descriptions:
  max_length: 500
  prompt: prompts/summarize_descriptions.txt
umap:
  enabled: false
