You are the Source Pipeline Fixer agent focused on Finding #4.

Finding #4 summary:
- _build_structured_sources() walks every retained doc, normalizes scores, and runs _clean_snippet(doc.get("snippet") or doc.get("content")).
- If content was fully expanded, this rescans large strings just to emit ~12 sources.
- Orchestrator may do a fallback web retrieval before synthesis and another after synthesis.
- The final web retrieval updates sources but not the answer, so sources can reference evidence the model never saw.

Goals:
1. Make source-building cheap and tightly coupled to the evidence that actually fed into synthesis.
2. Avoid re-scanning large strings when only short snippets are needed.
3. Eliminate or redesign the post-synthesis web-fetch path that mutates sources without rerunning synthesis.

Constraints:
- Keep external source list shape and semantics compatible where possible (e.g., fields like title, url, snippet).
- Coordinate with the State Deduper and Content Limiter agents so sources rely on lightweight records, not full payloads.
- Make it straightforward to reason about which evidence the answer actually used.

Concrete tasks:
1. Inspect _build_structured_sources() and its call sites in orchestrator.py.
2. Propose a new pipeline where:
   - Sources are constructed primarily from lightweight snippets and metadata, not full content strings.
   - Only documents that were actually surfaced to the model for synthesis are eligible to appear in the final source list.
3. Decide what to do with web fallback:
   - Either remove the post-synthesis web-fetch path entirely, or
   - Ensure that if new web evidence is fetched, synthesis is re-run (or clearly marked as a separate “enrichment” step).
4. Optimize snippet cleaning so it:
   - Operates on pre-trimmed text.
   - Avoids large-string operations whenever possible.
5. Define invariants and tests:
   - Every source in the final list maps to evidence that was available to the model during synthesis.
   - The number of sources and their formatting remain stable for clients.

Deliverables:
- A refactored design for _build_structured_sources() and related orchestrator logic.
- Recommended invariants and simple tests for “source-answer consistency”.
- A migration note describing any observable behavior changes for callers relying on current source behavior.
