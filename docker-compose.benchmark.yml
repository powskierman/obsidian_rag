services:
  lightrag-benchmark:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    container_name: obsidian-lightrag-benchmark
    ports:
      - "8003:8001"
    volumes:
      - "${OBSIDIAN_BENCH_VAULT_PATH:-/tmp/obsidian_subset}:/app/vault:ro"
      - "${LIGHTRAG_BENCH_DIR:-/tmp/lightrag_benchmark_db}:/app/lightrag_db"
    environment:
      - PYTHONUNBUFFERED=1
      - LIGHTRAG_DIR=/app/lightrag_db
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen3:latest}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_MODEL_PATH=${LLM_MODEL_PATH:-/Users/michel/models/Qwen3-8B-mlx}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - EMBED_ASYNC=${EMBED_ASYNC:-1}
      - LLM_ASYNC=${LLM_ASYNC:-1}
      - RAG_QUERY_TIMEOUT=${RAG_QUERY_TIMEOUT:-10}
      - LIGHTRAG_BATCH_SIZE=${LIGHTRAG_BATCH_SIZE:-3}
      - LIGHTRAG_BATCH_TIMEOUT=${LIGHTRAG_BATCH_TIMEOUT:-1200}
      - LIGHTRAG_CHUNK_TOKENS=${LIGHTRAG_CHUNK_TOKENS:-128}
      - LIGHTRAG_CHUNK_OVERLAP=${LIGHTRAG_CHUNK_OVERLAP:-32}
      - LIGHTRAG_MAX_DOC_CHARS=${LIGHTRAG_MAX_DOC_CHARS:-0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
