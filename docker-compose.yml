services:
  # ChromaDB Embedding Service
  embedding-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.embedding
    container_name: obsidian-embedding
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./chroma_db:/app/chroma_db:rw,cached
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-obsidian_vault}
      - CHROMA_DB_PATH=/app/chroma_db
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_HOST=${OLLAMA_FALLBACK_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
      - OBSIDIAN_VAULT_PATH=/app/vault
      - EMBEDDING_CLEAR_TOKEN=${EMBEDDING_CLEAR_TOKEN:-}
      - HUGGINGFACE_LOCAL_EMBEDDINGS=true
    command: python src/services/embedding_service.py
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - rag-network

  # Internal legacy graph subsystem: LightRAG used by cascading/deep-research retrieval.
  lightrag-service:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    container_name: obsidian-lightrag
    command: [ "gunicorn", "-w", "2", "-k", "gthread", "--threads", "2", "-b", "0.0.0.0:8001", "src.integrations.lightrag_service:app" ]
    ports:
      - "8001:8001"
    volumes:
      - "${OBSIDIAN_RAG_DATA_DIR}/lightrag_db:/app/lightrag_db"
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
      - ./src:/app/src:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LIGHTRAG_MODEL=${LIGHTRAG_MODEL:-}
      - KIMI_MODEL=${KIMI_MODEL:-}
      - LIGHTRAG_DIR=${LIGHTRAG_DIR:-/app/lightrag_db}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b-instruct}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LLM_MODEL_PATH=${LLM_MODEL_PATH:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_HOST=${OLLAMA_FALLBACK_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-${LLM_MODEL:-qwen2.5:7b-instruct}}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-240}
      - GRAPH_QUERY_OLLAMA_TIMEOUT=${GRAPH_QUERY_OLLAMA_TIMEOUT:-240}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lmstudio}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-${LLM_MODEL_PATH:-${LLM_MODEL:-local-model}}}
      - MLX_BASE_URL=${MLX_BASE_URL:-http://host.docker.internal:1234/v1}
      - MLX_API_KEY=${MLX_API_KEY:-mlx}
      - MLX_MODEL=${MLX_MODEL:-}
      - LIGHTRAG_EMBED_MODEL=${LIGHTRAG_EMBED_MODEL:-nomic-embed-text:latest}
      - EMBED_MODEL=${LIGHTRAG_EMBED_MODEL:-${EMBED_MODEL:-nomic-embed-text:latest}}
      - RAG_QUERY_TIMEOUT=${RAG_QUERY_TIMEOUT:-120}
      - EMBED_ASYNC=${EMBED_ASYNC:-1}
      - LLM_ASYNC=${LLM_ASYNC:-1}
      - MAX_ASYNC=${MAX_ASYNC:-1}
      - MAX_PARALLEL_INSERT=${MAX_PARALLEL_INSERT:-1}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-240}
      - TIMEOUT=${TIMEOUT:-240}
      - ENABLE_LLM_CACHE=${ENABLE_LLM_CACHE:-true}
      - ENABLE_LLM_CACHE_FOR_EXTRACT=${ENABLE_LLM_CACHE_FOR_EXTRACT:-true}
      - LIGHTRAG_BATCH_SIZE=${LIGHTRAG_BATCH_SIZE:-5}
      - LIGHTRAG_BATCH_TIMEOUT=${LIGHTRAG_BATCH_TIMEOUT:-300}
      - LIGHTRAG_CHUNK_TOKENS=${LIGHTRAG_CHUNK_TOKENS:-900}
      - LIGHTRAG_CHUNK_OVERLAP=${LIGHTRAG_CHUNK_OVERLAP:-120}
      - CHUNK_SIZE=${CHUNK_SIZE:-900}
      - CHUNK_OVERLAP_SIZE=${CHUNK_OVERLAP_SIZE:-120}
      - LIGHTRAG_DOC_TIMEOUT=${LIGHTRAG_DOC_TIMEOUT:-600}
      - LIGHTRAG_DOC_RETRY_ATTEMPTS=${LIGHTRAG_DOC_RETRY_ATTEMPTS:-1}
      - LIGHTRAG_HEARTBEAT_INTERVAL=${LIGHTRAG_HEARTBEAT_INTERVAL:-5}
      - LIGHTRAG_HEARTBEAT_STALL_SECONDS=${LIGHTRAG_HEARTBEAT_STALL_SECONDS:-60}
      - LIGHTRAG_DOC_EXECUTION_MODE=${LIGHTRAG_DOC_EXECUTION_MODE:-inprocess}
      - LIGHTRAG_QUERY_TOP_K=${LIGHTRAG_QUERY_TOP_K:-40}
      - LIGHTRAG_QUERY_CHUNK_TOP_K=${LIGHTRAG_QUERY_CHUNK_TOP_K:-40}
      - LIGHTRAG_QUERY_MAX_TOTAL_TOKENS=${LIGHTRAG_QUERY_MAX_TOTAL_TOKENS:-20000}
      - LIGHTRAG_DISABLE_QUERY_CACHE=${LIGHTRAG_DISABLE_QUERY_CACHE:-true}
      - LIGHTRAG_PURGE_QUERY_CACHE_ON_INDEX=${LIGHTRAG_PURGE_QUERY_CACHE_ON_INDEX:-true}
      - LIGHTRAG_PURGE_QUERY_CACHE_ON_PURGE=${LIGHTRAG_PURGE_QUERY_CACHE_ON_PURGE:-true}
      - LIGHTRAG_STRICT_GROUNDING=${LIGHTRAG_STRICT_GROUNDING:-true}
      - LIGHTRAG_NOISE_FILTER=${LIGHTRAG_NOISE_FILTER:-true}
      - LIGHTRAG_RERANK=${LIGHTRAG_RERANK:-true}
      - LIGHTRAG_MIN_SYNTHESIS_CHARS=${LIGHTRAG_MIN_SYNTHESIS_CHARS:-220}
      - LIGHTRAG_ENABLE_TWO_PASS_SYNTHESIS=${LIGHTRAG_ENABLE_TWO_PASS_SYNTHESIS:-true}
      - LIGHTRAG_SYNTHESIS_SOURCE_COUNT=${LIGHTRAG_SYNTHESIS_SOURCE_COUNT:-5}
      - LIGHTRAG_SYNTHESIS_SNIPPET_CHARS=${LIGHTRAG_SYNTHESIS_SNIPPET_CHARS:-1100}
      - LIGHTRAG_SYNTHESIS_TIMEOUT_SECONDS=${LIGHTRAG_SYNTHESIS_TIMEOUT_SECONDS:-75}
      - QUERY_LLM_PROVIDER=${QUERY_LLM_PROVIDER:-openrouter}
      - QUERY_LLM_MODEL=${QUERY_LLM_MODEL:-}
      - QUERY_LLM_MAX_TOKENS=${QUERY_LLM_MAX_TOKENS:-2048}
      - QUERY_LLM_TEMPERATURE=${QUERY_LLM_TEMPERATURE:-0}
      - QUERY_OPENROUTER_API_KEY=${QUERY_OPENROUTER_API_KEY:-}
      - QUERY_OPENAI_API_KEY=${QUERY_OPENAI_API_KEY:-}
      - QUERY_OPENAI_BASE_URL=${QUERY_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - QUERY_OPENAI_MODEL=${QUERY_OPENAI_MODEL:-gpt-4o-mini}
      - MAX_GLEANING=${MAX_GLEANING:-2}
      - ENTITY_EXTRACT_CHUNK_RETRY_ATTEMPTS=${ENTITY_EXTRACT_CHUNK_RETRY_ATTEMPTS:-2}
      - ENTITY_EXTRACT_CHUNK_RETRY_BACKOFF_SECONDS=${ENTITY_EXTRACT_CHUNK_RETRY_BACKOFF_SECONDS:-2.0}
      - ENTITY_EXTRACT_SKIP_FAILED_CHUNKS=${ENTITY_EXTRACT_SKIP_FAILED_CHUNKS:-true}
      - ENABLE_MARKDOWN_PREPROCESSING=${ENABLE_MARKDOWN_PREPROCESSING:-true}
      - OLLAMA_LLM_NUM_CTX=${OLLAMA_LLM_NUM_CTX:-32768}
      - OLLAMA_LLM_NUM_PREDICT=${OLLAMA_LLM_NUM_PREDICT:-2048}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-240}
      - LIGHTRAG_INDEX_TEXT_MODE=${LIGHTRAG_INDEX_TEXT_MODE:-raw}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LIGHTRAG_SUPPORTED_EXTENSIONS=${LIGHTRAG_SUPPORTED_EXTENSIONS:-.md}
      - LIGHTRAG_MAX_DOC_CHARS=${LIGHTRAG_MAX_DOC_CHARS:-120000}
      - LIGHTRAG_EXCLUDE_PATH_PATTERNS=${LIGHTRAG_EXCLUDE_PATH_PATTERNS:-}
      - LIGHTRAG_REINDEX_GUARD_MAX_RATIO=${LIGHTRAG_REINDEX_GUARD_MAX_RATIO:-0.35}
      - LIGHTRAG_REINDEX_GUARD_MIN_FILES=${LIGHTRAG_REINDEX_GUARD_MIN_FILES:-200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - rag-network

  # Internal legacy graph subsystem: NetworkX graph service used by cascading/deep-research retrieval.
  graph-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.graph
    container_name: obsidian-graph-service
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src:ro
      - "${OBSIDIAN_RAG_DATA_DIR}/graph_data:/app/graph_data"
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GRAPH_PATH=/app/graph_data/knowledge_graph_full.pkl
      - GRAPH_MODEL=${GRAPH_MODEL:-openrouter/auto}
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_HOST=${OLLAMA_FALLBACK_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lmstudio}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-${LLM_MODEL_PATH:-${LLM_MODEL:-local-model}}}
      - MLX_BASE_URL=${MLX_BASE_URL:-http://host.docker.internal:8090/v1}
      - MLX_API_KEY=${MLX_API_KEY:-mlx}
      - MLX_MODEL=${MLX_MODEL:-LiquidAI/LFM2-24B-A2B-MLX-4bit}
      - LLM_MODEL=${LLM_MODEL:-qwen3:latest}
      - GPT_OSS_HOST=${GPT_OSS_HOST:-http://host.docker.internal:12434/engines/llama.cpp}
    command: ["python", "-m", "src.services.graph_query_service"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - rag-network
    depends_on:
      embedding-service:
        condition: service_healthy

  # Unified API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.gateway
    container_name: obsidian-api-gateway
    ports:
      - "4000:3000"
    volumes:
      - ./src:/app/src:ro
      - ./deep_thinking:/app/deep_thinking:ro
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"

    command: python src/services/api_gateway.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - OBSIDIAN_VAULT_PATH=/app/vault
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      # Internal-only graph subsystem dependencies. Do not expose as public user-selectable modes.
      - GRAPH_SERVICE_URL=http://graph-service:8002
      - LIGHTRAG_SERVICE_URL=http://lightrag-service:8001
      - LIGHTRAG_QUERY_TIMEOUT=${LIGHTRAG_QUERY_TIMEOUT:-60}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/auto}
      - OPENROUTER_TIMEOUT=${OPENROUTER_TIMEOUT:-300}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_HOST=${OLLAMA_FALLBACK_HOST:-http://host.docker.internal:11434}
      - OLLAMA_FALLBACK_MODEL=${OLLAMA_FALLBACK_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-240}
      - QUERY_OLLAMA_TIMEOUT=${QUERY_OLLAMA_TIMEOUT:-240}
      - OLLAMA_LLM_NUM_CTX=${OLLAMA_LLM_NUM_CTX:-32768}
      - OLLAMA_LLM_NUM_PREDICT=${OLLAMA_LLM_NUM_PREDICT:-2048}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openrouter}
      - CASCADING_LLM_PROVIDER=${CASCADING_LLM_PROVIDER:-openrouter}
      - QUERY_NORMALIZER_TIMEOUT_SECONDS=${QUERY_NORMALIZER_TIMEOUT_SECONDS:-15}
      - CASCADING_SYNTHESIS_TIMEOUT_SECONDS=${CASCADING_SYNTHESIS_TIMEOUT_SECONDS:-25}
      - CASCADING_SYNTHESIS_TIMEOUT_SECONDS_REMOTE=${CASCADING_SYNTHESIS_TIMEOUT_SECONDS_REMOTE:-60}
      - CASCADING_SYNTHESIS_TIMEOUT_SECONDS_OPENROUTER=${CASCADING_SYNTHESIS_TIMEOUT_SECONDS_OPENROUTER:-300}
      - CASCADING_SYNTHESIS_TIMEOUT_SECONDS_PERPLEXITY=${CASCADING_SYNTHESIS_TIMEOUT_SECONDS_PERPLEXITY:-60}
      - CASCADING_SYNTHESIS_MAX_TOKENS=${CASCADING_SYNTHESIS_MAX_TOKENS:-1024}
      - CASCADING_SYNTHESIS_MAX_TOKENS_REMOTE=${CASCADING_SYNTHESIS_MAX_TOKENS_REMOTE:-384}
      - CASCADING_SYNTHESIS_MAX_TOKENS_REMOTE_COMPACT=${CASCADING_SYNTHESIS_MAX_TOKENS_REMOTE_COMPACT:-320}
      - CASCADING_SYNTHESIS_MAX_TOKENS_OPENROUTER=${CASCADING_SYNTHESIS_MAX_TOKENS_OPENROUTER:-384}
      - CASCADING_SYNTHESIS_MAX_TOKENS_OLLAMA=${CASCADING_SYNTHESIS_MAX_TOKENS_OLLAMA:-1024}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lmstudio}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-${LLM_MODEL_PATH:-${LLM_MODEL:-local-model}}}
      - QUERY_LMSTUDIO_BASE_URL=${QUERY_LMSTUDIO_BASE_URL:-${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}}
      - QUERY_LMSTUDIO_API_KEY=${QUERY_LMSTUDIO_API_KEY:-${LMSTUDIO_API_KEY:-lmstudio}}
      - MLX_BASE_URL=${MLX_BASE_URL:-http://host.docker.internal:8090/v1}
      - MLX_API_KEY=${MLX_API_KEY:-mlx}
      - MLX_MODEL=${MLX_MODEL:-${LLM_MODEL_PATH:-${LLM_MODEL:-LiquidAI/LFM2-24B-A2B-MLX-4bit}}}
      - QUERY_MLX_BASE_URL=${QUERY_MLX_BASE_URL:-${MLX_BASE_URL:-http://host.docker.internal:8090/v1}}
      - QUERY_MLX_API_KEY=${QUERY_MLX_API_KEY:-${MLX_API_KEY:-mlx}}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rag-network
    depends_on:
      embedding-service:
        condition: service_healthy
      # Required today for internal cascading/deep-research retrieval only.
      graph-service:
        condition: service_healthy
      lightrag-service:
        condition: service_healthy

  # Unified MCP server for local/Tailscale HTTP access.
  mcp-unified:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.mcp-unified
    container_name: obsidian-mcp-unified
    ports:
      - "8811:8811"
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./graph_data:/app/graph_data:ro
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:rw"
    environment:
      - PYTHONUNBUFFERED=1
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - GRAPH_SERVICE_URL=http://graph-service:8002
      - CLAUDE_GRAPH_SERVICE_URL=http://graph-service:8002
      - MCP_GATEWAY_URL=http://api-gateway:3000
      - OBSIDIAN_VAULT_PATH=/app/vault
      - KNOWLEDGE_GRAPH_PATH=/app/data/graph_data/knowledge_graph_full.pkl
      - MCP_CAPTURE_TEMPLATE_PATH=/app/vault/Templates/New Note Template.md
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8811
      - MCP_HTTP_PATH=/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8811/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rag-network
    depends_on:
      api-gateway:
        condition: service_healthy

  # Streamlit UI
  streamlit-ui:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.streamlit
    container_name: obsidian-ui
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./streamlit.log:/app/streamlit.log:rw
    environment:
      - PYTHONUNBUFFERED=1
      - API_GATEWAY_URL=http://api-gateway:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      embedding-service:
        condition: service_healthy
      # Streamlit talks to the gateway; graph-service remains only because the gateway still depends on it internally.
      graph-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  # Next.js WebApp
  webapp:
    build:
      context: ./webapp
      dockerfile: ../config/docker/Dockerfile.webapp
    container_name: obsidian-webapp
    ports:
      - "3030:3000"
    volumes:
      - ./webapp:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # Client-side (Browser) request URL - hits host port 4000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:4000
      # Server-side request URL - resolves over the internal docker network
      - GATEWAY_URL=http://api-gateway:3000
      - API_GATEWAY_URL=http://api-gateway:3000
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/auto}
      - GATEWAY_QUERY_TIMEOUT_MS=${GATEWAY_QUERY_TIMEOUT_MS:-60000}
      - GATEWAY_QUERY_TIMEOUT_MS_REMOTE=${GATEWAY_QUERY_TIMEOUT_MS_REMOTE:-180000}
      - GATEWAY_QUERY_TIMEOUT_MS_CASCADING=${GATEWAY_QUERY_TIMEOUT_MS_CASCADING:-300000}
      - GATEWAY_QUERY_TIMEOUT_MS_LMSTUDIO_CASCADING=${GATEWAY_QUERY_TIMEOUT_MS_LMSTUDIO_CASCADING:-180000}
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      api-gateway:
        condition: service_healthy

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_db:
  graph_storage:
