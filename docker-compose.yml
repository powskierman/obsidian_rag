services:
  # ChromaDB Embedding Service
  embedding-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.embedding
    container_name: obsidian-embedding
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src:ro
      - ./chroma_db:/app/chroma_db:rw,cached
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-obsidian_vault}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
      - OBSIDIAN_VAULT_PATH=/app/vault
      - EMBEDDING_CLEAR_TOKEN=${EMBEDDING_CLEAR_TOKEN:-}
    command: python src/services/embedding_service.py
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

  # LightRAG Service - Entity-centric knowledge graph for semantic search
  lightrag-service:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    container_name: obsidian-lightrag
    ports:
      - "8001:8001"
    volumes:
      - "${OBSIDIAN_RAG_DATA_DIR}/lightrag_db:/app/lightrag_db"
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - KIMI_MODEL=${KIMI_MODEL:-anthropic/claude-3.5-haiku}
      - LIGHTRAG_DIR=${LIGHTRAG_DIR:-/app/lightrag_db}
      - LLM_MODEL=${LLM_MODEL:-qwen3:latest}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - RAG_QUERY_TIMEOUT=${RAG_QUERY_TIMEOUT:-10}
      - EMBED_ASYNC=${EMBED_ASYNC:-1}
      - LIGHTRAG_BATCH_SIZE=${LIGHTRAG_BATCH_SIZE:-5}
      - LIGHTRAG_BATCH_TIMEOUT=${LIGHTRAG_BATCH_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

  # Reasoning Graph Service (NetworkX)
  graph-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.graph
    container_name: obsidian-graph-service
    ports:
      - "8002:8002"
    volumes:
      - ./src:/app/src:ro
      - ./data/graph_data:/app/graph_data
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
      - ./src/services/networkx_graph_builder.py:/app/networkx_graph_builder.py:ro
      - ./src/services/graph_query_service.py:/app/graph_query_service.py:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GRAPH_PATH=${GRAPH_PATH:-/app/graph_data/knowledge_graph_full.pkl}
      - KIMI_MODEL=${KIMI_MODEL:-anthropic/claude-3.5-haiku}
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - LLM_MODEL=${LLM_MODEL:-qwen3:latest}
      - GPT_OSS_HOST=${GPT_OSS_HOST:-http://host.docker.internal:12434/engines/llama.cpp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service

  # Unified API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.gateway
    container_name: obsidian-api-gateway
    ports:
      - "4000:3000"
    volumes:
      - ./src:/app/src:ro

    command: python src/services/api_gateway.py
    environment:
      - PYTHONUNBUFFERED=1
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - GRAPH_SERVICE_URL=http://graph-service:8002
      - LIGHTRAG_SERVICE_URL=http://lightrag-service:8001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
      - graph-service
      - lightrag-service

  # Streamlit UI
  streamlit-ui:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.streamlit
    container_name: obsidian-ui
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src:ro
      - ./streamlit.log:/app/streamlit.log:rw
    environment:
      - PYTHONUNBUFFERED=1
      - API_GATEWAY_URL=http://api-gateway:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - embedding-service
      - graph-service

  # Next.js WebApp
  webapp:
    build:
      context: ./webapp
      dockerfile: ../config/docker/Dockerfile.webapp
    container_name: obsidian-webapp
    ports:
      - "3000:3000"
    volumes:
      - ./webapp:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      # Client-side (Browser) request URL - hits host port 4000
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:4000
      # Server-side request URL (if used) - hits internal docker service
      # - GATEWAY_URL=http://api-gateway:3000
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - api-gateway

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_db:
  graph_storage:
