services:
  # ChromaDB Embedding Service
  embedding-service:
    build:
      context: .
      dockerfile: Dockerfile.embedding
    container_name: obsidian-embedding
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db:rw
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

  # LightRAG Knowledge Graph Service (Legacy)
  lightrag-service:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    container_name: obsidian-lightrag
    ports:
      - "8001:8001"
    volumes:
      - ./lightrag_db:/app/lightrag_db:rw
      - "/Users/michel/Library/Mobile Documents/iCloud~md~obsidian/Documents/Michel:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-Llama3.1:8b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - LIGHTRAG_DIR=/app/lightrag_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
    profiles:
      - lightrag

  # GraphRAG Knowledge Graph Service (Stable Alternative)
  graphrag-service:
    build:
      context: .
      dockerfile: Dockerfile.graphrag
    container_name: obsidian-graphrag
    ports:
      - "8002:8002"  # Updated to match service port
    volumes:
      - ./graphrag_db:/app/graphrag_db:rw,cached
      - "/Users/michel/Library/Mobile Documents/iCloud~md~obsidian/Documents/Michel:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5-coder:14b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - GRAPHRAG_DIR=/app/graphrag_db
      - VAULT_PATH=/app/vault
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
    profiles:
      - graphrag

  # GraphRAG-Local-Ollama Service (Local Models)
  graphrag-local-service:
    build:
      context: .
      dockerfile: Dockerfile.graphrag-local
    container_name: obsidian-graphrag-local
    ports:
      - "8003:8001"  # Different external port
    volumes:
      - ./graphrag_local_db:/app/ragtest:rw
      - "/Users/michel/Library/Mobile Documents/iCloud~md~obsidian/Documents/Michel:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLM_MODEL=${LLM_MODEL:-Llama3.1:8b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - GRAPHRAG_DIR=/app/ragtest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
    profiles:
      - graphrag-local

  # GraphRAG-Claude Service (Cloud Models with Claude Code Credits)
  graphrag-claude-service:
    build:
      context: .
      dockerfile: Dockerfile.graphrag-local
    container_name: obsidian-graphrag-claude
    ports:
      - "8004:8001"  # Different external port
    volumes:
      - ./graphrag_claude_db:/app/ragtest:rw
      - "/Users/michel/Library/Mobile Documents/iCloud~md~obsidian/Documents/Michel:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GRAPHRAG_DIR=/app/ragtest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
    profiles:
      - graphrag-claude
    command: ["python", "graphrag_claude_service.py"]

  # GraphRAG-GPT-OSS Service (Docker Model Runner)
  graphrag-gpt-oss-service:
    build:
      context: .
      dockerfile: Dockerfile.graphrag
    container_name: obsidian-graphrag-gpt-oss
    ports:
      - "8005:8001"  # Different external port
    volumes:
      - ./graphrag_gpt_oss_db:/app/graphrag_db:rw
      - "/Users/michel/Library/Mobile Documents/iCloud~md~obsidian/Documents/Michel:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://host.docker.internal:12434/engines/llama.cpp
      - LLM_MODEL=ai/gpt-oss:latest
      - EMBED_MODEL=nomic-embed-text
      - EMBED_HOST=http://host.docker.internal:11434
      - GRAPHRAG_DIR=/app/graphrag_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
    profiles:
      - graphrag-gpt-oss

  # Streamlit UI
  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: obsidian-ui
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit.log:/app/streamlit.log:rw
    environment:
      - PYTHONUNBUFFERED=1
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - LIGHTRAG_SERVICE_URL=http://lightrag-service:8001
      - GRAPHRAG_SERVICE_URL=http://graphrag-service:8002
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GRAPH_SERVICE=${GRAPH_SERVICE:-lightrag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - embedding-service

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_db:
  lightrag_db:
  graphrag_db:
  graphrag_gpt_oss_db:

