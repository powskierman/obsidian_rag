services:
  # ChromaDB Embedding Service
  embedding-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.embedding
    container_name: obsidian-embedding
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db:rw,cached
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
      - ./src/services/embedding_service.py:/app/embedding_service.py:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

  # LightRAG Service - Entity-centric knowledge graph for semantic search
  lightrag-service:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    container_name: obsidian-lightrag
    ports:
      - "8001:8001"
    volumes:
      - ./lightrag_db:/app/lightrag_db
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - LIGHTRAG_MODEL=${LIGHTRAG_MODEL:-}
      - KIMI_MODEL=${KIMI_MODEL:-}
      - LIGHTRAG_DIR=/app/lightrag_db
      - OLLAMA_HOST=http://host.docker.internal:11434
      - EMBED_MODEL=${EMBED_MODEL:-nomic-ai/nomic-embed-text-v1.5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network

  # Reasoning Graph Service (NetworkX)
  graph-service:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.graph
    container_name: obsidian-graph-service
    ports:
      - "8002:8002"
    volumes:
      - ./data/graph_data:/app/graph_data
      - ./src/services/networkx_graph_builder.py:/app/networkx_graph_builder.py:ro
      - ./src/services/graph_query_service.py:/app/graph_query_service.py:ro
      - "${OBSIDIAN_VAULT_PATH}:/app/vault:ro"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GRAPH_PATH=/app/graph_data/knowledge_graph_full.pkl
      - GRAPH_MODEL=${GRAPH_MODEL:-openrouter/auto}
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - GPT_OSS_HOST=${GPT_OSS_HOST:-http://host.docker.internal:12434/engines/llama.cpp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service

  # Unified API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.gateway
    container_name: obsidian-api-gateway
    ports:
      - "4000:3000"
    volumes:
      - ./src/services/api_gateway.py:/app/api_gateway.py:ro
      - ./deep_thinking:/app/deep_thinking:ro
    environment:
      - PYTHONUNBUFFERED=1
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
      - GRAPH_SERVICE_URL=http://graph-service:8002
      - LIGHTRAG_SERVICE_URL=http://lightrag-service:8001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MLX_BASE_URL=${MLX_BASE_URL:-http://host.docker.internal:8090/v1}
      - MLX_API_KEY=${MLX_API_KEY:-mlx}
      - MLX_MODEL=${MLX_MODEL:-${LLM_MODEL_PATH:-${LLM_MODEL:-LiquidAI/LFM2-24B-A2B-MLX-4bit}}}
      - QUERY_MLX_BASE_URL=${QUERY_MLX_BASE_URL:-${MLX_BASE_URL:-http://host.docker.internal:8090/v1}}
      - QUERY_MLX_API_KEY=${QUERY_MLX_API_KEY:-${MLX_API_KEY:-mlx}}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag-network
    depends_on:
      - embedding-service
      - graph-service
      - lightrag-service

  # Streamlit UI
  streamlit-ui:
    build:
      context: .
      dockerfile: config/docker/Dockerfile.streamlit
    container_name: obsidian-ui
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit.log:/app/streamlit.log:rw
      - ./src/ui/streamlit_ui_docker.py:/app/streamlit_ui_docker.py:ro
    environment:
      - PYTHONUNBUFFERED=1
      - API_GATEWAY_URL=http://api-gateway:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - rag-network
    depends_on:
      - embedding-service
      - graph-service

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_db:
  graph_storage:
  lightrag_storage:
